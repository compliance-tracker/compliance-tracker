spring.application.name=compliance-tracker

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5434/compliance_tracker
spring.datasource.username=postgres
spring.datasource.password=devpassword

# validate: Hibernate checks the DB schema matches the @Entity classes at startup and fails
# loudly if not, but never mutates the schema itself - Flyway (src/main/resources/db/migration)
# owns all schema changes now. update was fine for solo local dev but unsafe against a real
# database with real data (issue #7) - e.g. renaming a field could silently drop a column.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# aws.sqs.endpoint is set here for local dev against LocalStack. When deploying to real AWS
# (issue #5), leave this property unset/blank - SqsConfig falls back to the SDK's default
# credential chain and endpoint resolution instead of LocalStack's fake ones.
aws.region=us-east-1
aws.sqs.endpoint=http://localhost:4566
aws.sqs.queue-name=compliance-reminders

# Frontend dev server (Vite default port). Update/override once the frontend has a real
# deployed URL.
app.cors.allowed-origin=http://localhost:5173

# jwt.secret: dev-only value, generated via `openssl rand -base64 32`. Must be a real secret
# (not committed anywhere sensitive/public in a real deployment) and long enough for HMAC-SHA256
# (>=256 bits) - Keys.hmacShaKeyFor throws at startup if it's too short.
jwt.secret=04r6vb/78+5VZS4jQPmJ1P669O0ZxGQ5veyDTW+QpW4=
# 24 hours, in milliseconds
jwt.expiration-ms=86400000

# notifications.channel: which NotificationSender bean is active (issue #17).
# "logging" (default) just logs - safe for CI/local dev, needs no real mail credentials at all.
# "email" activates EmailNotificationSender - requires spring.mail.* below to be set to a real
# account (e.g. via env vars, never committed) before it'll actually send anything real, or to
# Mailpit (see README's "Notifications" section) to preview emails locally without any real
# account at all.
notifications.channel=logging
notifications.email-from=${MAIL_FROM:${MAIL_USERNAME:}}

# Defaults to real Gmail SMTP - use an app password (myaccount.google.com/apppasswords), not
# your real Gmail password, since Google blocks plain-password SMTP login outright once 2FA is
# on. Every value here is overridable via env var so the same config can instead point at
# Mailpit (a local fake SMTP server + web UI, see README) for previewing emails without any
# real account/credentials at all - e.g. MAIL_HOST=localhost MAIL_PORT=1025
# MAIL_SMTP_AUTH=false MAIL_SMTP_STARTTLS=false.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}