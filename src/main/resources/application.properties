spring.application.name=compliance-tracker

server.port=8081

# Request correlation IDs (issue #51) - CorrelationIdFilter puts a per-request ID into SLF4J's
# MDC; logging.pattern.level is Spring Boot's own documented hook for injecting MDC content into
# the default log pattern without needing a full custom logback-spring.xml. %5p is the original
# default (log level, right-padded to 5 chars) - this just appends the correlation ID (or a
# literal "-" via the :- fallback, for any log line produced outside a request, e.g. at startup).
logging.pattern.level=%5p [%X{correlationId:-}]

# DB_PASSWORD env var override (issue #40) - the "devpassword" default below only ever matches
# the local Docker Postgres/CI service containers (see README), which nothing real depends on.
# It's still a checked-in value though, so treat it as public forever, not actually secret -
# a real deployment must set DB_PASSWORD to a real, freshly-generated value via a proper secret
# store (AWS Secrets Manager/Parameter Store, not another committed property).
spring.datasource.url=jdbc:postgresql://localhost:5434/compliance_tracker
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:devpassword}

# validate: Hibernate checks the DB schema matches the @Entity classes at startup and fails
# loudly if not, but never mutates the schema itself - Flyway (src/main/resources/db/migration)
# owns all schema changes now. update was fine for solo local dev but unsafe against a real
# database with real data (issue #7) - e.g. renaming a field could silently drop a column.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Actuator (issue #44). Only "health" is exposed over HTTP - the full default set (env, beans,
# etc.) would leak far more than a load balancer/orchestrator ever needs, and everything else
# stays reachable only via direct JMX/actuator Java API if ever needed. probes.enabled=true adds
# the Kubernetes-style /actuator/health/liveness and /actuator/health/readiness sub-groups
# alongside the overall /actuator/health - liveness answers "is the JVM alive" (always UP unless
# something is deeply broken), readiness answers "can this instance actually serve traffic right
# now" (folds in the real DB connectivity check Spring Boot auto-configures from the DataSource
# on the classpath). show-details=never keeps the public response to a bare {"status":"UP"} -
# component-level detail (e.g. which DB it's checking, connection pool stats) is exactly the
# kind of internal detail an unauthenticated endpoint shouldn't expose.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# A real, previously-unknown bug found live while verifying this endpoint: Spring Boot
# auto-configures a "mail" health indicator the instant spring-boot-starter-mail is on the
# classpath, which tries an actual SMTP connection to smtp.gmail.com at health-check time. With
# no real Gmail credentials configured (notifications.channel=logging is this app's deliberate,
# safe zero-config default - see EmailNotificationSender/LoggingNotificationSender), that
# connection always fails, which dragged the *entire* aggregate /actuator/health to DOWN even
# though the app itself was completely fine - exactly the false-positive a load balancer's
# health check must never see, since it would kill perfectly healthy instances. Real email is an
# opt-in feature this app is explicitly designed to work without; health/readiness must reflect
# that, not assume every optional integration is actually configured.
management.health.mail.enabled=false

# aws.sqs.endpoint is set here for local dev against LocalStack. When deploying to real AWS
# (issue #5), leave this property unset/blank - SqsConfig falls back to the SDK's default
# credential chain and endpoint resolution instead of LocalStack's fake ones.
aws.region=us-east-1
aws.sqs.endpoint=http://localhost:4566
aws.sqs.queue-name=compliance-reminders
# DLQ monitoring (issue #18) - matches the naming convention already established in
# README/docs/architecture.md's LocalStack setup instructions (<queue-name>-dlq), expressed as a
# property (not hardcoded string concatenation in Java) so it stays correct if aws.sqs.queue-name
# is ever overridden for a real deployment.
aws.sqs.dlq-name=${aws.sqs.queue-name}-dlq

# Frontend dev server (Vite default port). Update/override once the frontend has a real
# deployed URL.
app.cors.allowed-origin=http://localhost:5173

# JWT_SECRET env var override (issue #40). The value below is a dev-only placeholder,
# generated via `openssl rand -base64 32` - it has been committed to this public repo's git
# history, so treat it as permanently public, not actually secret, even though it's only used
# to sign tokens for local Postgres/CI. A real deployment MUST set JWT_SECRET to a fresh value
# generated the same way, via a real secret store - reusing this default anywhere real would let
# anyone who's ever read this repo forge valid tokens for any user. Must resolve to something
# long enough for HMAC-SHA256 (>=256 bits) - Keys.hmacShaKeyFor throws at startup if too short.
jwt.secret=${JWT_SECRET:04r6vb/78+5VZS4jQPmJ1P669O0ZxGQ5veyDTW+QpW4=}
# 24 hours, in milliseconds - kept unchanged for now (issue #26) even though a shorter access
# token lifetime (e.g. 15 min) is the more secure norm once a refresh flow exists - shortening
# this now, before the frontend actually implements silent refresh, would just make users get
# logged out more often with no way to recover. Revisit once the frontend half lands.
jwt.expiration-ms=86400000
# 7 days, in milliseconds - the refresh token, used only against POST /api/auth/refresh.
jwt.refresh-expiration-ms=604800000
# 1 hour, in milliseconds - how long a password reset token (issue #37) stays valid after
# POST /api/auth/forgot-password. Short deliberately: unlike the JWT refresh token above (which
# exists to extend a session the user is actively using), this token's only job is bridging the
# short gap between "just clicked the email" and "just typed a new password" - no reason for it
# to still work hours or days later.
auth.password-reset-expiration-ms=3600000
# 7 days, in milliseconds - how long an email verification token (issue #36) stays valid.
# Deliberately longer than the password reset token above: verifying an email is much lower
# stakes than resetting a password, and a new user might not check their inbox right away -
# no reason to force them to re-register just because a few days passed.
auth.email-verification-expiration-ms=604800000

# notifications.channel: which NotificationSender bean is active (issue #17).
# "logging" (default) just logs - safe for CI/local dev, needs no real mail credentials at all.
# "email" activates EmailNotificationSender - requires spring.mail.* below to be set to a real
# account (e.g. via env vars, never committed) before it'll actually send anything real, or to
# Mailpit (see README's "Notifications" section) to preview emails locally without any real
# account at all.
notifications.channel=logging
notifications.email-from=${MAIL_FROM:${MAIL_USERNAME:}}

# Defaults to real Gmail SMTP - use an app password (myaccount.google.com/apppasswords), not
# your real Gmail password, since Google blocks plain-password SMTP login outright once 2FA is
# on. Every value here is overridable via env var so the same config can instead point at
# Mailpit (a local fake SMTP server + web UI, see README) for previewing emails without any
# real account/credentials at all - e.g. MAIL_HOST=localhost MAIL_PORT=1025
# MAIL_SMTP_AUTH=false MAIL_SMTP_STARTTLS=false.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}